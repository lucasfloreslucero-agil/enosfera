<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enosfera</title>
  <meta name="description" content="Enosfera — próximamente.">
  <style>
    :root { color-scheme: light dark; --bg: #faf7f2; --fg: #1c1a17; --muted: #6b655c; }
    @media (prefers-color-scheme: dark) { :root { --bg: #141210; --fg: #f3efe8; --muted: #a39c90; } }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: var(--bg); color: var(--fg);
      font-family: ui-serif, Georgia, "Times New Roman", serif; text-align: center;
    }
    h1 { font-size: clamp(2.5rem, 9vw, 5rem); font-weight: 500; letter-spacing: -0.02em; margin: 0 0 12px; }
    p { margin: 0; color: var(--muted); font-family: system-ui, sans-serif; font-size: 1rem; letter-spacing: 0.12em; text-transform: uppercase; }
  </style>
</head>
<body>
  <main>
    <h1>Enosfera</h1>
    <p>Próximamente</p>
  </main>
</body>
</html>
